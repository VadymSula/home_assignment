name: Android Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: TestNG suite to run
        type: choice
        default: regression
        options:
          - regression
          - known-bugs
          - full-suite
      enable_ai:
        description: Enable OpenRouter analysis for a manual run on main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    name: ${{ matrix.device }} · Android ${{ matrix.android }} (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: Google Pixel 7
            profile: pixel_7
            android: '14'
            api: 34
          - device: Google Pixel 4a
            profile: pixel_4a
            android: '16'
            api: 36
    # Store OPENAI_API_KEY only in the android-ai environment restricted to main.
    environment: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.enable_ai && 'android-ai' || 'android-ci' }}
    env:
      NODE_VERSION: '22.23.5'
      APPIUM_VERSION: '3.9.1'
      UIAUTOMATOR2_VERSION: '8.6.0'
      APPIUM_HOST: '127.0.0.1'
      APPIUM_PORT: '4723'
      APPIUM_LOG: logs/appium.log
      TEST_SUITE: ${{ inputs.suite || 'regression' }}
      AI_ANALYSIS_ENABLED: >-
        ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        && inputs.enable_ai && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Maven cache
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable KVM
        shell: bash
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::The runner does not have usable KVM access."
            exit 1
          fi

      - name: Install Appium and UiAutomator2
        timeout-minutes: 8
        shell: bash
        run: |
          test "$(node --version)" = "v$NODE_VERSION"
          npm install --global --no-audit --no-fund "appium@$APPIUM_VERSION"
          appium driver install "uiautomator2@$UIAUTOMATOR2_VERSION"

      - name: Start Appium
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p "$(dirname "$APPIUM_LOG")"
          nohup appium --address "$APPIUM_HOST" --port "$APPIUM_PORT" \
            --log-level info --log-no-colors > "$APPIUM_LOG" 2>&1 &
          appium_pid=$!
          printf '%s\n' "$appium_pid" > "$RUNNER_TEMP/appium.pid"

          for _ in {1..30}; do
            if curl --fail --silent --max-time 2 "http://$APPIUM_HOST:$APPIUM_PORT/status" |
              jq -e '.value.ready == true' > /dev/null; then
              exit 0
            fi
            kill -0 "$appium_pid" 2>/dev/null || break
            sleep 1
          done
          echo "::error::Appium did not become ready. See the Appium log artifact."
          exit 1

      - name: Boot Google Play emulator and run TestNG
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 55
        env:
          DEVICE_NAME: ${{ matrix.device }}
          ANDROID_VERSION: ${{ matrix.android }}
          ANDROID_API_LEVEL: ${{ matrix.api }}
          OPENAI_API_KEY: ${{ env.AI_ANALYSIS_ENABLED == 'true' && secrets.OPENAI_API_KEY || '' }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: inclusionai/ling-3.2-flash:free
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -accel on
          pre-emulator-launch-script: '"$ANDROID_HOME/emulator/emulator" -accel-check'
          # Blank lines separate the commands run by the emulator action.
          script: >-
            timeout 45s adb -s "$ANDROID_SERIAL" wait-for-device

            test "$(timeout 10s adb -s "$ANDROID_SERIAL" get-state)" = device

            test "$(timeout 10s adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed)" = 1

            test "$(timeout 10s adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk)" = "$ANDROID_API_LEVEL"

            test "$(timeout 10s adb -s "$ANDROID_SERIAL" shell getprop ro.product.cpu.abi)" = x86_64

            timeout 10s adb -s "$ANDROID_SERIAL" shell pm path com.android.vending | grep '^package:' > /dev/null

            bash -euo pipefail -c 'accounts="$(timeout 15s adb -s "$ANDROID_SERIAL" shell dumpsys account)";
            if ! grep -Eq "^[[:space:]]*Accounts: [0-9]+[[:space:]]*$" <<<"$accounts"
            || grep -Eq "^[[:space:]]*Account [{][^}]*type=com[.]google([,}]|$)" <<<"$accounts"; then
            echo "::error::Could not verify a signed-out Google Play emulator."; exit 1; fi'

            curl --fail --silent --show-error --max-time 5 "http://$APPIUM_HOST:$APPIUM_PORT/status" |
            jq -e '.value.ready == true' > /dev/null

            case "$TEST_SUITE" in regression|known-bugs|full-suite) ;; *) echo "::error::Invalid suite selection."; exit 1 ;; esac

            timeout --kill-after=30s 35m mvn --batch-mode --no-transfer-progress clean test
            "-Dsurefire.suiteXmlFiles=src/test/resources/suites/$TEST_SUITE.xml"
            "-Ddevice.name=$DEVICE_NAME"
            "-Ddevice.udid=$ANDROID_SERIAL"
            "-Dplatform.version=$ANDROID_VERSION"
            "-Dappium.server.url=http://$APPIUM_HOST:$APPIUM_PORT"

      - name: Stop Appium
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/appium.pid"
          if [[ -s "$pid_file" ]]; then
            read -r appium_pid < "$pid_file"
            kill -TERM "$appium_pid" 2>/dev/null || exit 0
            for _ in {1..10}; do
              kill -0 "$appium_pid" 2>/dev/null || exit 0
              sleep 1
            done
            kill -KILL "$appium_pid" 2>/dev/null || true
          fi

      - name: Generate Allure report
        if: ${{ always() && hashFiles('target/allure-results/*-result.json') != '' }}
        timeout-minutes: 5
        run: mvn --batch-mode --no-transfer-progress allure:report

      - name: Upload device reports and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: android-${{ matrix.profile }}-api${{ matrix.api }}-${{ env.TEST_SUITE }}-attempt${{ github.run_attempt }}
          path: |
            target/allure-report/
            target/allure-results/
            target/artifacts/
            target/surefire-reports/
            ${{ env.APPIUM_LOG }}
          if-no-files-found: warn
          retention-days: 7
